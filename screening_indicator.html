<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>按指标选股 · A股复盘选股中心</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:#f0f2f5;color:#1a1a2e;min-height:100vh}
.header{background:#fff;border-bottom:1px solid #e9ecef;padding:18px 16px;text-align:center;position:relative;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.header a.back{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:14px;color:#4263eb;text-decoration:none}
.header h1{font-size:20px;font-weight:700}
.header .subtitle{margin-top:4px;font-size:12px;color:#868e96}
.wrap{max-width:1180px;margin:22px auto;padding:0 14px}
.panel{background:#fff;border-radius:12px;padding:16px 18px;box-shadow:0 1px 4px rgba(0,0,0,.05);margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:6px;font-size:12px;color:#868e96}
.fld select,.fld input{border:1px solid #dee2e6;border-radius:7px;padding:7px 9px;font-size:13px;color:#1a1a2e;background:#fff;height:36px;min-width:112px}
.fld input.w80{min-width:80px;width:80px}
.seg{display:inline-flex;border:1px solid #dee2e6;border-radius:7px;overflow:hidden;height:36px;flex-wrap:wrap}
.seg button{border:0;background:#fff;padding:0 11px;font-size:13px;color:#495057;cursor:pointer;white-space:nowrap}
.seg button+button{border-left:1px solid #e9ecef}
.seg button:hover{color:#4263eb}
.seg button.on{background:#4263eb;color:#fff;font-weight:700}
.btn{border:1px solid #dee2e6;background:#fff;border-radius:7px;padding:7px 14px;font-size:13px;cursor:pointer;height:36px}
.btn.primary{background:#4263eb;border-color:#4263eb;color:#fff;font-weight:700;padding:7px 22px}
.btn:hover{border-color:#4263eb;color:#4263eb}
.btn.primary:hover{background:#3956d5;color:#fff}
.datepair{display:none;gap:8px;align-items:flex-end;flex-wrap:wrap}
.datepair.on{display:flex}
.more-row{margin-top:12px;padding-top:12px;border-top:1px dashed #e9ecef;display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.more-row[hidden]{display:none}
.toggle{font-size:12px;color:#4263eb;cursor:pointer;user-select:none;margin-top:13px}
.note{font-size:12px;color:#adb5bd;line-height:1.65;margin-top:10px}
.res{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.res-h{padding:12px 18px;border-bottom:1px solid #eef1f8;font-size:13px;color:#495057;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cnt{color:#4263eb;font-weight:700}
.tag{background:#f1f3f5;color:#868e96;border-radius:5px;padding:2px 7px;font-size:12px}
.tblbox{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:#f8f9fc;color:#495057;font-weight:600;text-align:right;padding:9px 12px;white-space:nowrap;cursor:pointer;user-select:none;border-bottom:1px solid #eef1f8}
th:first-child,th:nth-child(2),th:nth-child(3){text-align:left}
th:hover{color:#4263eb}
th::after{content:" ⇅";font-size:.72em;color:#aab4c5}
th.asc::after{content:" ↑";color:#2f6bff}th.desc::after{content:" ↓";color:#2f6bff}
td{padding:8px 12px;border-bottom:1px solid #f4f5f8;text-align:right;white-space:nowrap}
td:first-child,td:nth-child(2),td:nth-child(3){text-align:left}
td.nm{font-weight:600}
tr:hover td{background:#fafbff}
.up{color:#e5484d;font-weight:600}.dn{color:#2f9e44;font-weight:600}
.rk{color:#868e96}
.loading{text-align:center;padding:48px;color:#868e96;line-height:2}
.empty{text-align:center;padding:40px;color:#adb5bd}
.statline{font-size:12px;color:#868e96;margin-left:auto}
@media(max-width:600px){.header{padding:14px 10px}.wrap{margin:14px auto;padding:0 8px}.panel{padding:12px}.row{gap:10px}.fld select,.fld input{min-width:88px}.seg button{padding:0 8px;font-size:12px}table{font-size:12px}th,td{padding:7px 8px}.statline{margin-left:0}}
</style>
</head>
<body>
<div class="header"><a class="back" href="screening.html">&#8592; 返回</a>
<h1>按指标选股</h1>
<div class="subtitle">全市场 · 任意区间夏普 / 收益率排名 · <span id="data-date">加载中…</span></div>
</div>
<div class="wrap">
  <div class="panel">
    <div class="row">
      <div class="fld"><span>排序指标</span><select id="metric">
        <option value="sh">夏普比率（年化）</option>
        <option value="ret">区间收益率</option>
      </select></div>
      <div class="fld"><span>排名前 N</span><input type="number" id="topn" class="w80" value="20" min="1" max="500"></div>
      <button class="btn primary" id="go" type="button">查询排名</button>
      <span class="toggle" id="tg-more">更多筛选 ▾</span>
    </div>
    <div class="row" style="margin-top:14px">
      <div class="fld"><span>时间范围</span><div class="seg" id="ranges">
        <button type="button" data-r="m1">近1月</button><button type="button" data-r="m3">近3月</button>
        <button type="button" data-r="m6">近6月</button><button type="button" data-r="y1" class="on">近1年</button>
        <button type="button" data-r="y3">近3年</button><button type="button" data-r="y5">近5年</button>
        <button type="button" data-r="y10">近10年</button><button type="button" data-r="custom">自定义</button>
      </div></div>
      <div class="datepair" id="datepair">
        <div class="fld"><span>开始日期</span><input type="date" id="d1"></div>
        <div class="fld"><span>结束日期</span><input type="date" id="d2"></div>
      </div>
    </div>
    <div class="more-row" hidden id="more-row">
      <div class="fld"><span>收益率下限(%)</span><input type="number" id="rmin" class="w80" placeholder="不限"></div>
      <div class="fld"><span>收益率上限(%)</span><input type="number" id="rmax" class="w80" placeholder="不限"></div>
      <div class="fld"><span>代码/名称</span><input type="text" id="q" placeholder="搜索" style="min-width:130px"></div>
      <button class="btn" id="reset" type="button">重置</button>
    </div>
    <div class="note" id="note">口径：夏普 = 日均收益 / 标准差 × √252（剔除单日涨跌超30%的异常日）；区间收益 = 区间内日收益累乘 − 1。按未复权日K计算，除权除息日可能失真；结果仅供参考，不构成投资建议。</div>
  </div>

  <div class="res">
    <div class="res-h"><span class="cnt" id="cnt">—</span><span class="tag" id="range-tag"></span>
      <span class="statline" id="statline"></span></div>
    <div class="tblbox"><table id="tb"><thead><tr>
      <th data-k="rank" style="width:52px">排名</th><th data-k="code">代码</th><th data-k="name">名称</th>
      <th data-k="sh">夏普比率</th><th data-k="ret">区间收益</th><th data-k="n">有效交易日</th>
    </tr></thead><tbody id="tbody"></tbody></table></div>
    <div class="loading" id="loading" hidden>正在计算，请稍候…</div>
  </div>
</div>

<script>
(function(){
'use strict';
var M=null, DATE2I={}, CACHE={}, RESULT=[], SORT={k:'',asc:false};
var SERIES={}, YEAR_INFO={};
var $=function(id){return document.getElementById(id);};

function fmtPct(v){if(v===null||v===undefined||!isFinite(v))return '—';return (v>0?'+':'')+(v*100).toFixed(2)+'%';}
function fmtNum(v){if(v===null||v===undefined||!isFinite(v))return '—';return v.toFixed(2);}
function cls(v){return v>0?'up':(v<0?'dn':'');}

/* 二分找 <=d 的最近交易日（结束日用） */
function align(d,lo,hi){
  var a=M.dates;if(!lo)lo=0;if(hi===undefined)hi=a.length-1;
  if(d<a[0])return 0;if(d>=a[hi])return hi;
  while(lo<hi){var mid=(lo+hi+1)>>1;if(a[mid]<=d)lo=mid;else hi=mid-1;}
  return lo;
}
/* 二分找 >=d 的最近交易日（开始日用，保证不早于用户指定日期） */
function alignStart(d){
  var a=M.dates,lo=0,hi=a.length-1;
  if(d<=a[0])return 0;if(d>a[hi])return hi;
  while(lo<hi){var mid=(lo+hi)>>1;if(a[mid]<d)lo=mid+1;else hi=mid;}
  return lo;
}
function rangeIdx(){
  var last=M.dates.length-1,a=M.dates,r=S.range;
  if(r==='custom'){
    var d1=$('d1').value,d2=$('d2').value;
    if(!d1||!d2){return null;}
    if(d1>d2){alert('开始日期不能晚于结束日期');return null;}
    return [alignStart(d1),align(d2)];
  }
  var n={m1:21,m3:63,m6:126}[r];
  if(n)return [Math.max(0,last-n+1),last];
  var yrs={y1:1,y3:3,y5:5,y10:10}[r]||1;
  var dt=new Date(a[last]+'T00:00:00');dt.setFullYear(dt.getFullYear()-yrs);
  var target=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
  return [align(target),last];
}
function loadSeries(year){
  if(CACHE[year])return CACHE[year];
  CACHE[year]=fetch('_series_'+year+'.gz?v='+Date.now()).then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status+' year '+year);
    /* 先拿完整字节再解压：线上经过代理的网络流直接 pipeThrough 会挂起 */
    return r.arrayBuffer();
  }).then(function(buf){
    if(typeof DecompressionStream==='undefined')throw new Error('浏览器不支持 DecompressionStream，请用最新版 Chrome/Edge');
    var blob=new Blob([buf]);
    return new Response(blob.stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
  }).then(function(buf){return new Int16Array(buf);});
  return CACHE[year];
}
function compute(s,e){
  var N=M.codes.length, nday=e-s+1, inv=M.invalid, scale=M.scale;
  var sum=new Float64Array(N),sq=new Float64Array(N),mul=new Float64Array(N),cnt=new Uint16Array(N);
  for(var k=0;k<N;k++)mul[k]=1;
  var years=[];
  for(var gi=s;gi<=e;gi++){var y=M.dates[gi].slice(0,4);if(years.indexOf(y)<0)years.push(y);}
  return Promise.all(years.map(loadSeries)).then(function(arrs){
    for(var t=0;t<years.length;t++)SERIES[years[t]]=arrs[t];
    for(var gi=s;gi<=e;gi++){
      var d=M.dates[gi], y=d.slice(0,4), yinfo=YEAR_INFO[y];
      var arr=SERIES[y], off=(gi-yinfo.off)*N;
      for(var k=0;k<N;k++){
        var v=arr[off+k];if(v===inv)continue;
        var r=v/scale;mul[k]*=(1+r);
        if(r>0.3||r<-0.3)continue;
        sum[k]+=r;sq[k]+=r*r;cnt[k]++;
      }
    }
    var out=[];
    for(var k2=0;k2<N;k2++){
      var c=cnt[k2];if(c<Math.max(20,Math.floor(nday*0.6)))continue;
      var mean=sum[k2]/c, varc=(sq[k2]-c*mean*mean)/(c-1);
      if(!(varc>0))continue;
      var sh=mean/Math.sqrt(varc)*Math.sqrt(252);
      if(!isFinite(sh))continue;
      out.push({code:M.codes[k2][0],name:M.codes[k2][1],sh:sh,ret:mul[k2]-1,n:c});
    }
    return out;
  });
}
function quantile(a,p){if(!a.length)return null;var b=a.slice().sort(function(x,y){return x-y;});var i=(b.length-1)*p,lo=Math.floor(i),hi=Math.ceil(i);return b[lo]+(b[hi]-b[lo])*(i-lo);}
function render(){
  var rows=RESULT,q=$('q').value.trim().toLowerCase();
  var lo=$('rmin').value===''?null:parseFloat($('rmin').value)/100,hi=$('rmax').value===''?null:parseFloat($('rmax').value)/100;
  rows=rows.filter(function(r){
    if(lo!==null&&r.ret<lo)return false;if(hi!==null&&r.ret>hi)return false;
    if(q&&(r.code+' '+r.name).toLowerCase().indexOf(q)<0)return false;return true;
  });
  var key=SORT.k||S.metric,asc=SORT.asc;
  rows.sort(function(a,b){var x=a[key],y=b[key];if(typeof x==='string')return asc?x.localeCompare(y):y.localeCompare(x);return asc?x-y:y-x;});
  var top=Math.max(1,Math.min(500,parseInt($('topn').value,10)||20));
  var shown=rows.slice(0,top);
  $('cnt').textContent='符合条件 '+rows.length+' 只 · 显示前 '+shown.length+' 名';
  var shs=rows.map(function(r){return r.sh;}),rets=rows.map(function(r){return r.ret;});
  $('statline').textContent='样本 '+rows.length+' · 夏普中位 '+fmtNum(quantile(shs,.5))+' · 正收益 '+(rets.length?(rets.filter(function(v){return v>0;}).length/rets.length*100).toFixed(1)+'%':'—');
  var h='';
  for(var i=0;i<shown.length;i++){var r=shown[i];
    h+='<tr><td class="rk">'+(i+1)+'</td><td class="rk">'+r.code+'</td><td class="nm">'+r.name+'</td>'+
       '<td>'+fmtNum(r.sh)+'</td><td class="'+cls(r.ret)+'">'+fmtPct(r.ret)+'</td><td class="rk">'+r.n+'</td></tr>';
  }
  $('tbody').innerHTML=h||'<tr><td colspan="6" class="empty">无符合条件的股票</td></tr>';
  document.querySelectorAll('#tb thead th').forEach(function(th){
    th.classList.toggle('asc',SORT.k===th.dataset.k&&SORT.asc);
    th.classList.toggle('desc',SORT.k===th.dataset.k&&!SORT.asc);
  });
}
function run(){
  if(!M)return;
  var ix=rangeIdx();if(!ix)return;
  S.s=ix[0];S.e=ix[1];
  $('range-tag').textContent='区间 '+M.dates[S.s]+' ~ '+M.dates[S.e]+'（'+(S.e-S.s+1)+'个交易日）';
  $('loading').hidden=false;$('tbody').innerHTML='';
  compute(S.s,S.e).then(function(rows){
    RESULT=rows;SORT.k='';SORT.asc=false;$('loading').hidden=true;render();
  }).catch(function(err){
    $('loading').hidden=true;$('tbody').innerHTML='<tr><td colspan="6" class="empty">计算失败：'+err.message+'</td></tr>';
    console.error(err);
  });
}
function bind(){
  document.querySelectorAll('#ranges button').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('#ranges button').forEach(function(x){x.classList.remove('on');});
      b.classList.add('on');S.range=b.dataset.r;
      $('datepair').classList.toggle('on',S.range==='custom');
      if(S.range==='custom'){$('d1').value=M.dates[Math.max(0,M.dates.length-252)];$('d2').value=M.dates[M.dates.length-1];}
    });
  });
  $('go').addEventListener('click',run);
  $('metric').addEventListener('change',function(){S.metric=this.value;SORT.k='';render();});
  $('topn').addEventListener('input',render);
  ['q','rmin','rmax'].forEach(function(id){$(id).addEventListener('input',render);});
  $('datepair').addEventListener('change',function(){if(S.range==='custom')run();});
  $('tg-more').addEventListener('click',function(){
    var row=$('more-row');row.hidden=!row.hidden;
    this.textContent=row.hidden?'更多筛选 ▾':'收起筛选 ▴';
  });
  $('reset').addEventListener('click',function(){
    $('q').value='';$('rmin').value='';$('rmax').value='';$('topn').value=20;
    S.metric='sh';$('metric').value='sh';SORT.k='';render();
  });
  document.querySelectorAll('#tb thead th').forEach(function(th){
    th.addEventListener('click',function(){
      var k=this.dataset.k;if(SORT.k===k)SORT.asc=!SORT.asc;else{SORT.k=k;SORT.asc=false;}
      render();
    });
  });
}
var S={range:'y1',metric:'sh',s:0,e:0};
fetch('_series_meta.json?v='+Date.now()).then(function(r){return r.json();}).then(function(d){
  M=d;M.years.forEach(function(y){YEAR_INFO[y.y]=y;});
  $('data-date').textContent='数据至 '+M.date+' · '+M.codes.length+' 只A股';
  $('d1').min=M.start;$('d1').max=M.date;$('d2').min=M.start;$('d2').max=M.date;
  bind();run();
}).catch(function(e){$('data-date').textContent='数据加载失败';console.error(e);});
})();
</script>
</body>
</html>
