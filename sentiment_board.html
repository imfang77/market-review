<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>情绪看板 | A股复盘选股中心</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:#f0f2f5;color:#1a1a2e;min-height:100vh}
.header{background:#fff;border-bottom:1px solid #e9ecef;padding:20px 0;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.05);position:relative}
.header a.back,.header .back{position:absolute;left:12px;top:12px;font-size:13px;color:#4263eb;text-decoration:none;white-space:nowrap}
.header h1{font-size:20px;font-weight:700}
.header .subtitle{margin-top:4px;font-size:13px;color:#868e96}
.container{max-width:720px;margin:32px auto;padding:0 16px}
.section-title{font-size:13px;color:#868e96;text-transform:uppercase;letter-spacing:1.5px;font-weight:600;margin-bottom:16px;padding-left:4px}
.report-list{display:flex;flex-direction:column;gap:12px}
.report-card{display:block;background:#fff;border:1px solid #e9ecef;border-radius:10px;padding:20px 24px;text-decoration:none;color:inherit;transition:all .2s ease;position:relative}
.report-card:hover{border-color:#4263eb;box-shadow:0 4px 12px rgba(66,99,235,.12);transform:translateY(-1px)}
.report-card .card-header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.report-card .date-text{font-size:18px;font-weight:700}
.report-card .arrow{position:absolute;right:20px;top:20px;font-size:20px;color:#adb5bd}
.report-card .summary{font-size:13px;color:#868e96;line-height:1.7}
/* 与条件选股 screening.html 完全同款：badge-date + 未读红点 */
.report-card .meta{margin-top:9px;font-size:12px;color:#495057;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.badge-date{background:#f1f3f5;border-radius:10px;padding:3px 10px;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:#e03131;display:inline-block;box-shadow:0 0 0 3px rgba(224,49,49,0.18)}
.dot.hide{display:none}
.tip{text-align:center;font-size:13px;color:#868e96;margin:14px 0 0}
@media(max-width:600px){.container{margin:20px auto;padding:0 12px}.report-card{padding:16px 16px}.report-card .date-text{font-size:16px}.report-card .arrow{right:14px;top:14px;font-size:17px}}
</style>
</head>
<body>
<div class="header">
<h1>情绪看板</h1><div class="subtitle">融资余额 / 涨跌家数 / 个股融资余额 / 宽基ETF资金流</div></div>
<div class="container">
  <div class="section-title">数据看板</div>
  <div class="report-list">
    <a class="report-card" href="sentiment_rzrq.html" id="card-rz">
      <div class="card-header"><span class="date-text">融资余额 · 涨跌家数 · 个股融资余额</span></div>
      <div class="summary">每日融资余额与上涨家数双轴走势；表格含每日融资余额、每日涨跌家数、个股融资余额明细（融资余额为 T+1 披露，最新 2026-11-20）</div>
      <div class="meta">
        <span class="badge-date" id="rz-date">更新于 —</span>
        <span class="dot hide" id="rz-dot"></span>
      </div>
      <span class="arrow">&#8599;</span>
    </a>
    <a class="report-card" href="sentiment_etf.html" id="card-etf">
      <div class="card-header"><span class="date-text">宽基 ETF 资金流</span></div>
      <div class="summary">宽基 ETF 累计净申购与指数走势；表格支持按日期 / 按ETF / 按宽基指数三维度查看</div>
      <div class="meta">
        <span class="badge-date" id="etf-date">更新于 —</span>
        <span class="dot hide" id="etf-dot"></span>
      </div>
      <span class="arrow">&#8599;</span>
    </a>
  </div>
  <div class="tip">红色圆点表示情绪看板有更新未查看。</div>
</div>
<script>
/* 与条件选股 screening.html 同款：更新于 YYYY-MM-DD + 未读红点（localStorage 记忆已读）。 */
var RZ_DATE = "20261120", UD_DATE = "20261123", ETF_DATE = "20261123";
var META_KEY = "ashare_sentiment_meta_read_v1";
function loadRead(){ try { return JSON.parse(localStorage.getItem(META_KEY) || "{}"); } catch(e){ return {}; } }
function saveRead(o){ try { localStorage.setItem(META_KEY, JSON.stringify(o)); } catch(e){} }
function fmtDate(d){ if(!d) return "—"; return d.replace(/^(\d{4})(\d{2})(\d{2})$/, "$1-$2-$3"); }
var read = loadRead();
function setupCard(prefix, dateStr){
  var dEl = document.getElementById(prefix + "-date");
  var dot = document.getElementById(prefix + "-dot");
  dEl.textContent = "更新于 " + fmtDate(dateStr);
  var seen = read[prefix] || "";
  var hasNew = dateStr && dateStr > seen;
  dot.classList.toggle("hide", !hasNew);
}
setupCard("rz", UD_DATE);
setupCard("etf", ETF_DATE);
function markRead(prefix, dateStr){
  var r = loadRead(); r[prefix] = dateStr || ""; saveRead(r);
  var dot = document.getElementById(prefix + "-dot");
  dot.classList.add("hide");
}
document.getElementById("card-rz").addEventListener("click", function(){ markRead("rz", UD_DATE); });
document.getElementById("card-etf").addEventListener("click", function(){ markRead("etf", ETF_DATE); });
</script>
</body>
</html>
