<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>全部股票型 ETF 净申购</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7fa;color:#1e2533;font:13px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:16px 18px 40px}
.hd{text-align:center;margin-bottom:12px}
.hd h1{font-size:17px;margin:0 0 3px;font-weight:650}
.hd .sub{display:block;font-size:11.5px;color:#8a94a6}
.up{color:#d81e3f!important}.dn{color:#0f9d58!important}
.panel{background:#fff;border:1px solid #e6ebf2;border-radius:9px;padding:12px 16px;margin-bottom:14px}
.lbl{font-size:11.5px;color:#8a94a6;margin-right:8px}
/* 顶部等式（总=分） */
.eqbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.eqbar .sum{border:2px solid #2563eb;background:#eff6ff;border-radius:8px;padding:7px 13px;cursor:pointer;user-select:none;position:relative}
.eqbar .sum .nm{font-size:12.5px;color:#1e40af;font-weight:700}
.eqbar .sum .amt{font-size:16px;font-weight:700;margin-left:9px}
.eqbar .part{border:1px solid #e2e8f0;background:#fbfcfe;border-radius:7px;padding:7px 12px;cursor:pointer;user-select:none;position:relative}
.eqbar .part.on{border-color:#93b8f5;background:#f5f9ff}
.eqbar .part .nm{font-size:12px;color:#475569}
.eqbar .part .amt{font-size:14px;font-weight:650;margin-left:8px}
.eqbar .op{color:#64748b;font-size:17px;font-weight:500;padding:0 1px;user-select:none}
.eqbar input[type=checkbox]{width:13px;height:13px;accent-color:#2563eb;margin:0 6px 0 0;vertical-align:-2px;cursor:pointer}
.eqbar .sum:hover .hovercard,.eqbar .part:hover .hovercard{display:block}
.hovercard{display:none;position:absolute;top:calc(100% + 6px);left:0;z-index:50;background:#fff;border:1px solid #dbe3ee;border-radius:8px;box-shadow:0 6px 20px rgba(31,41,55,.12);padding:9px 11px;min-width:190px;font-size:11.5px;color:#475569;line-height:1.9}
.hovercard b{color:#1e293b}
.hovercard .r{display:flex;justify-content:space-between;gap:18px}
@media(max-width:720px){
  .eqbar{display:grid;grid-template-columns:13px minmax(0,1fr) 13px minmax(0,1fr) 13px minmax(0,1fr);gap:3px;align-items:stretch}
  .eqbar .sum{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 8px;text-align:center}
  .eqbar .sum .nm{font-size:11.5px}
  .eqbar .sum .amt{font-size:13px;margin-left:0}
  .eqbar .part{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 2px;text-align:center;min-width:0}
  .eqbar .part .nm{font-size:10px;white-space:nowrap}
  .eqbar .part .amt{font-size:12px;margin-left:0}
  .eqbar .part input{margin:0}
  .eqbar .op{font-size:14px;display:flex;align-items:center;justify-content:center}
  .eqbar .hovercard{display:none!important}
}
/* 时间段筛选 */
.rngbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 12px 0}
.rngbar .lbl{margin-right:2px}
.rng-btn{border:1px solid #dfe5ee;background:#fff;color:#64748b;font-size:11.5px;padding:3px 11px;border-radius:4px;cursor:pointer}
.rng-btn.active{background:#2f6bff;border-color:#2f6bff;color:#fff;font-weight:600}
@media(max-width:720px){.rngbar{gap:4px;padding:8px 9px 0}.rng-btn{padding:3px 8px;font-size:11px}}
/* 图 */
.chartbox{background:#fff;border:1px solid #e6ebf2;border-radius:9px;padding:12px 16px 8px;margin-bottom:0}
.ctitle{font-size:13px;font-weight:600;margin-bottom:4px}
#csvg{width:100%;height:auto;display:block}
.cdesc{font-size:11.5px;color:#7b8798;line-height:1.6;padding:6px 2px 4px}
.grans{display:flex;align-items:center;justify-content:flex-start;gap:8px;padding:9px 12px 7px;font-size:11.5px;color:#8a94a6;background:#fff;border:1px solid #e6ebf2;border-top:0;border-radius:0 0 9px 9px;margin-bottom:14px;flex-wrap:wrap}
.grans button{border:1px solid #dfe5ee;background:#fff;border-radius:4px;padding:2px 12px;font-size:11.5px;color:#64748b;cursor:pointer}
.grans button.on{background:#2563eb;color:#fff;border-color:#2563eb}
.grans .catsep{width:1px;height:14px;background:#e6ebf2;margin:0 4px}
.grans .cats{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.grans .ck{font-size:11.5px}
@media(max-width:720px){
  .grans{gap:6px 8px;padding:8px 11px}
  .grans>span:first-child{flex:1 1 100%;font-size:11px}
  .grans .catsep{display:none}
  .grans .lbl{flex:0 0 auto;font-size:11px}
  .grans .cats{flex:1 1 100%;justify-content:flex-start;gap:12px}
}
.tabs{display:flex;gap:0;border-bottom:1px solid #dfe5ee}
.tabs button{border:0;background:#fff;padding:8px 18px;font-size:12.5px;color:#64748b;cursor:pointer;border-bottom:2px solid transparent}
.tabs button.on{color:#2563eb;border-bottom-color:#2563eb;font-weight:600}
.toolbar{display:flex;align-items:center;justify-content:space-between;padding:9px 0;gap:10px;flex-wrap:wrap}
.dims{display:flex;gap:6px}
.dims button{border:1px solid #dfe5ee;background:#fff;border-radius:4px;padding:4px 12px;font-size:11.5px;color:#64748b;cursor:pointer}
.dims button.on{background:#2563eb;color:#fff;border-color:#2563eb}
.ck{display:flex;align-items:center;gap:5px;font-size:12px;color:#475569;cursor:pointer}
.ck input{width:13px;height:13px;accent-color:#2563eb;margin:0}
.tw{background:#fff;border:1px solid #e6ebf2;border-radius:0 0 9px 9px;overflow:auto}
table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}
th{background:#f7f9fc;color:#5b6678;font-weight:600;padding:6px 8px;text-align:center;border-bottom:1px solid #e6ebf2;cursor:pointer;user-select:none}
th:hover{background:#eef3fb}
td{padding:5px 8px;border-bottom:1px solid #f0f3f7;text-align:right;font-variant-numeric:tabular-nums}
td.l,th.l{text-align:left}
td.ctr,th.ctr{text-align:center}
tbody tr:hover{background:#fafbfd}
.nmwrap{display:inline-flex;align-items:center;gap:6px}
.subcode{display:block;font-size:10.5px;color:#9aa4b2;margin-top:1px;line-height:1.2}
.lk{color:#2563eb!important;cursor:pointer;text-decoration:none}
.lk:hover{text-decoration:underline}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.tag{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:3px;background:#f1f5f9;color:#64748b}
.tag.b{background:#eff6ff;color:#2563eb}.tag.t{background:#f5f3ff;color:#7c3aed}.tag.s{background:#f0fdf4;color:#15803d}
.totrow{background:#f8fafc;font-weight:700}
.grandrow th{background:#eef4ff;color:#1e40af;font-weight:700}
.subrow td{padding:0;background:#fbfcfe}
.subin{padding:7px 12px 10px}
.subhint{font-size:11.5px;color:#7b8798;margin:3px 0 6px;text-align:left}
.subtabs{display:flex;gap:6px;margin-bottom:6px}
.subtabs button{border:1px solid #dfe5ee;background:#fff;border-radius:4px;padding:2px 10px;font-size:11px;color:#64748b;cursor:pointer}
.subtabs button.on{background:#2563eb;color:#fff;border-color:#2563eb}
.subin table{width:auto;background:#fff;border:1px solid #e6ebf2;border-radius:5px}
.subin table th,.subin table td{padding:4px 9px}
.subsec{margin-bottom:12px}
.subsec h4{font-size:11.5px;margin:0 0 4px;color:#334155}
.note{font-size:11.5px;color:#8a94a6;line-height:1.7;padding:10px 2px 0}
.ircur{display:flex;align-items:center;gap:14px;padding:9px 0;font-size:12px;color:#475569;flex-wrap:wrap}
.ircur label{cursor:pointer;display:flex;align-items:center;gap:4px}
.ircur input{width:13px;height:13px;accent-color:#2563eb;margin:0}
.ircusbtn{border:1px solid #93b8f5;background:#f5f9ff;border-radius:4px;padding:2px 9px;font-size:11.5px;color:#2563eb;font-weight:600;cursor:pointer}
.ircusrow{display:flex;align-items:center;gap:7px;margin-top:-3px;padding:8px 0;font-size:11.5px;color:#64748b}
.ircusrow input{border:1px solid #dfe5ee;border-radius:4px;padding:3px 6px;font-size:11.5px}
.irasof{font-size:11px;color:#9aa4b2}
.legend{display:flex;gap:10px;font-size:10.5px;color:#64748b;margin-top:2px}
.legend i{width:9px;height:9px;display:inline-block;border-radius:2px;margin-right:3px;vertical-align:-1px}
/* v12 新增 */
[hidden]{display:none!important}
.chartbox{position:relative}
#csvg{cursor:crosshair}
.ctip{display:none;position:fixed;z-index:99;pointer-events:none;background:#fff;border:1px solid #dbe3ee;border-radius:8px;box-shadow:0 8px 24px rgba(31,41,55,.16);padding:9px 11px;font-size:11.5px;color:#475569;line-height:1.75;min-width:186px}

.ctip .r{display:flex;align-items:center;justify-content:space-between;gap:16px}
.ctip .r b{font-variant-numeric:tabular-nums}
.ctip .r.tot{border-top:1px solid #eef1f6;margin-top:3px;padding-top:3px}
.ctip i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:5px}
.subrow .subin{border-left:3px solid #2563eb;margin-left:6px;background:#f8fbff}
.oth .subin{border-left-color:#7c3aed}
@media(max-width:720px){
  .subhint,.subsec h4,[data-fromdate]{font-size:11px!important;line-height:1.5}
  .subsec h4{text-align:left!important}
  .subrow .subin{margin-left:0;padding:7px 8px}
  .subin table{display:block;width:100%!important;overflow:auto}
  #csvg text{font-size:21px!important}
}

/* 涨跌汇总 */
function idxNetRange(nm,ds){
  const m=(IDXD.idxNet||{})[nm]||{};let s=0,has=false;
  ds.forEach(d=>{if(m[d]!==undefined){s+=m[d];has=true;}});
  return has?s:null;
}
function idxRetRange(nm,ds){
  const m=(IDXD.idxPx||{})[nm]||{};
  const have=HIST.dates.filter(d=>m[d]!==undefined);
  const sel=ds.filter(d=>m[d]!==undefined);
  if(sel.length<2||have.length<2)return null;
  const i0=have.indexOf(sel[0]);
  const b=i0>0?have[i0-1]:sel[0];
  return m[sel[sel.length-1]]/m[b]-1;
}
function fmtPct(v){return v===null||v===undefined?'—':(v>0?'+':'')+(v*100).toFixed(2)+'%';}
function cellPair(nm,ds,fixedNet,fixedRet){
  const net=ds?idxNetRange(nm,ds):fixedNet;
  const ret=ds?idxRetRange(nm,ds):fixedRet;
  return '<td class="'+cls(net)+'">'+f(net)+'</td><td class="'+cls(ret)+'">'+fmtPct(ret)+'</td>';
}

let CHART_PTS=[];
function chart(){
  const keys=activeKeys(),all=isAll(),W=1000,H=330,L=68,R=76,T=26,B=48;
  const zero=T+(H-T-B)/2, plotB=H-B;
  const ps=periods().slice(0,6).reverse();
  const CDATE=ps.map(p=>gran==='day'?p.label.slice(5):p.label);
  const multi=keys.length>1;
  const vals=ps.map((p,idx)=>{
    if(!multi){const v=netOf(keys[0],p);return [v!==undefined?v:(idx===ps.length-1?TOTAL[keys[0]]:0)];}
    return keys.map(k=>{const v=netOf(k,p);return v!==undefined?v:(idx===ps.length-1?TOTAL[k]:0);});
  });
  const stocks=ps.map(p=>{const v=(SHARE.stock||{})[p.latest];return typeof v==='number'?v:null;});
  let maxv=1;
  vals.forEach(x=>{let p=0,n=0;x.forEach(v=>{v>=0?p+=v:n+=v;});maxv=Math.max(maxv,p,Math.abs(n));});
  const sv=stocks.filter(v=>v!==null);
  let smin=sv.length?Math.min(...sv):0,smax=sv.length?Math.max(...sv):1;
  if(smax-smin<1){smax=smin+1;}
  const sc=(H-T-B)/2/maxv, bw=58, gap=(W-L-R-50)/Math.max(vals.length,1);
  const sy=v=>plotB-(v-smin)/(smax-smin)*(plotB-T);
  let g='';
  // 网格 + 左轴（份额存量）+ 右轴（净申购）
  for(let i=0;i<=4;i++){

    g+='<line x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+(W-R)+'" y2="'+y.toFixed(1)+'" stroke="'+(i===2?'#cbd5e1':'#eef2f7')+'" stroke-dasharray="'+(i===2?'0':'3 3')+'"/>';
    const lv=smax-(smax-smin)*i/4, rv=maxv-maxv*i/2;
    g+='<text x="'+(L-8)+'" y="'+(y+4.5).toFixed(1)+'" text-anchor="end" font-size="12.5" fill="#2f6bff">'+Math.round(lv).toLocaleString()+'</text>';

  g+='<text x="'+(W-R+8)+'" y="'+(T-8)+'" font-size="12.5" font-weight="600" fill="#64748b">净申购（亿元）</text>';

  const pts=[];
  stocks.forEach((v,i)=>{if(v!==null)pts.push([L+26+i*gap+bw/2,sy(v)]);});
  if(pts.length>1)g+='<polyline points="'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')+'" fill="none" stroke="#2f6bff" stroke-width="2.4" stroke-linejoin="round"/>';
  pts.forEach(p=>{g+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.6" fill="#fff" stroke="#2f6bff" stroke-width="2"/>';});
  CHART_PTS=[];
  vals.forEach((x,i)=>{
    const bx=L+26+i*gap, cx=bx+bw/2;
    CHART_PTS.push({cx:cx,date:ps[i].label,vals:x,total:totalOf(ps[i]),visTotal:x.reduce((a,b)=>a+b,0),stock:stocks[i],label:CDATE[i],per:ps[i]});
    let pos=0,neg=0;
    x.forEach((v,j)=>{
      if(!v)return;
      const h=Math.abs(v)*sc;
      g+='<rect x="'+bx.toFixed(1)+'" y="'+(v>=0?zero-pos-h:zero+neg).toFixed(1)+'" width="'+bw+'" height="'+h.toFixed(1)+'" fill="'+(v>=0?RED[j%3]:GREEN[j%3])+'" opacity=".85"/>';
      v>=0?pos+=h:neg+=h;
    });
    const tot=x.reduce((a,b)=>a+b,0);
    g+='<text x="'+cx.toFixed(1)+'" y="'+(tot>=0?Math.max(zero-pos-7,T+12):zero+neg+19).toFixed(1)+'" text-anchor="middle" font-size="12.5" font-weight="700" fill="'+(tot>=0?'#d81e3f':'#0f9d58')+'">'+f(tot)+'</text>';
    g+='<text x="'+cx.toFixed(1)+'" y="'+(H-14)+'" text-anchor="middle" font-size="12.5" fill="#64748b">'+CDATE[i]+'</text>';
  });
  $('#csvg').innerHTML=g;
  $('#cht').textContent='全部股票 ETF 净申购';
  const lg='<div class="legend"><span><i style="background:#2f6bff"></i>全市场份额存量（亿份·左轴）</span>'+keys.map((k,i)=>'<span><i style="background:'+RED[i%3]+'"></i>'+SHORT[k]+'（亿元·右轴）</span>').join('')+'</div>';
  $('#cdesc').innerHTML='蓝线＝全市场 1,401 只股票型 ETF 份额存量（宽基+行业主题+策略汇总，左轴）；红绿柱＝当日净申购（右轴，按类别分段，红涨绿跌）。时间段 '+rangeName()+' · '+granName()+'粒度（周/月净申购为求和、蓝线取周期末）。历史为全市场重算，11-27 与定稿一致。'+lg;
}
/* 悬浮框跟随鼠标 */
$('#csvg').addEventListener('mousemove',e=>{
  if(!CHART_PTS.length)return;
  const rect=$('#csvg').getBoundingClientRect();
  const x=(e.clientX-rect.left)*(1000/rect.width);
  let best=CHART_PTS[0],bd=1e9;
  CHART_PTS.forEach(p=>{const d=Math.abs(p.cx-x);if(d<bd){bd=d;best=p;}});
  const ks=['bidx','theme','strat'];
  const html='<div class="hd">'+best.date+'</div>'+
    ks.map((k,i)=>{const v=netOf(k,best.per);return '<div class="r"><span><i style="background:'+(v>=0?RED[i%3]:GREEN[i%3])+'"></i>'+SHORT[k]+'</span><b class="'+cls(v)+'">'+f(v)+' 亿</b></div>';}).join('')+
    '<div class="r tot"><span>合计</span><b class="'+cls(best.total)+'">'+f(best.total)+' 亿</b></div>'+
    '<div class="r"><span>全市场份额存量</span><b style="color:#2f6bff">'+(best.stock===null||best.stock===undefined?'—':Number(best.stock).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}))+' 亿份</b></div>';
  const t=$('#ctip');t.innerHTML=html;t.style.display='block';
  const w=t.offsetWidth||200,h=t.offsetHeight||120;
  t.style.left=Math.min(e.clientX+16,window.innerWidth-w-10)+'px';
  t.style.top=Math.max(8,Math.min(e.clientY-h/2,window.innerHeight-h-10))+'px';
});
$('#csvg').addEventListener('mouseleave',()=>{$('#ctip').style.display='none';});

/* 事件 */
$('#tbl').onclick=e=>{
  let b=e.target.closest('.subtabs button');
  if(b){subTab[b.dataset.name]=b.dataset.sub;renderAll();return;}
  const th=e.target.closest('th');
  if(th){const i=th.cellIndex;if(i>=0){sort.dir=(sort.k===i?-sort.dir:-1);sort.k=i;renderAll();}return;}
  if(e.target.closest('[data-oth]')){expanded=(expanded&&expanded.type==='oth')?null:{type:'oth'};renderAll();return;}
  let r=e.target.closest('.daterow');
  if(r){const i=+r.dataset.i;expanded=(expanded&&expanded.type==='date'&&expanded.i===i)?null:{type:'date',i};renderAll();return;}
  r=e.target.closest('.idxrow');
  if(r){const kk=r.dataset.k,n=r.dataset.name,key=kk+'|'+n;expandedIdx=(expandedIdx===key)?null:key;renderAll();return;}
  r=e.target.closest('.etfdrill');
  if(r){const k=r.dataset.k,i=+r.dataset.i;expanded=(expanded&&expanded.type==='etf'&&expanded.k===k&&expanded.i===i)?null:{type:'etf',k,i};renderAll();return;}
  r=e.target.closest('.idxmain');
  if(r){const k=r.dataset.k,i=+r.dataset.i;expanded=(expanded&&expanded.type==='imain'&&expanded.k===k&&expanded.i===i)?null:{type:'imain',k,i};renderAll();return;}
};
function renderAll(){
  renderSel();renderDims();chart();
  $('#tbl').innerHTML=dim==='date'?renderDate():dim==='etf'?renderEtf():dim==='idx'?renderIdx():renderGroup();
  if(sort.k>=0){
    const tb=$('#tbl tbody');
    const tops=[...tb.children].filter(tr=>!tr.classList.contains('subrow'));
    tops.sort((a,b)=>{
      const x=[...a.children].find(td=>td.cellIndex===sort.k)?.innerText||'', y=[...b.children].find(td=>td.cellIndex===sort.k)?.innerText||'';
      const nx=Number(String(x).replace(/[+−,]/g,m=>m==='−'?'-':'')),ny=Number(String(y).replace(/[+−,]/g,m=>m==='−'?'-':''));
      if(!isNaN(nx)&&!isNaN(ny))return (nx-ny)*sort.dir;
      return x.localeCompare(y,'zh')*sort.dir;
    });
    tops.forEach(tr=>tb.appendChild(tr));
  }
  if(tab==='chg')renderChg();
}
renderAll();renderChg();

</script></body></html>
