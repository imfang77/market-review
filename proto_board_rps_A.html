  for(var i=0;i<closes.length;i++){
    if(i<per-1){out.push(null);continue;}
    var s=0;for(var j=i-per+1;j<=i;j++)s+=closes[j];
    out.push(+(s/per).toFixed(2));
  }
  return out;
}
function detectGaps(rows){
  var g=[];
  for(var i=1;i<rows.length;i++){
    var yh=rows[i-1][2], yl=rows[i-1][3], th=rows[i][2], tl=rows[i][3], d=rows[i][0];
    if(tl>yh) g.push({d:d,type:'up',price:tl});
    else if(th<yl) g.push({d:d,type:'down',price:th});
  }
  return g;
}

function renderRPSTab(){
  var b=P.boards[state.code];
  var hist=b.rpsHist;
  var rng=state.range;
  var slice=hist.slice(-rng);
  var dates=slice.map(function(r){return r.d;});
  // price return aligned by date
  var closeByDate={};
  b.day.forEach(function(r){closeByDate[r[0]]=r[4];});
  var baseClose = closeByDate[slice[0].d];
  var price=slice.map(function(r){var c=closeByDate[r.d]; return c==null?null:+( (c-baseClose)/baseClose*100 ).toFixed(2);});
  var series = RPS_KEYS.map(function(p,idx){
    return {name:'R'+p[0], type:'line', showSymbol:false, smooth:true,
      data: slice.map(function(r){return r.rps[idx];}),
      lineStyle:{width: p[0]==='20'?3:1.6, color:SKIN.rps[idx]},
      itemStyle:{color:SKIN.rps[idx]}, z:p[0]==='20'?5:3};
  });
  series.push({name:'价格收益%', type:'line', yAxisIndex:1, showSymbol:false, smooth:true,
    data:price, lineStyle:{width:1.4,type:'dashed',color:SKIN.priceLine}, itemStyle:{color:SKIN.priceLine}, z:2});

  var opt={
    backgroundColor:'transparent',
    legend:{data:series.map(function(s){return s.name;}), textStyle:{color:SKIN.legend}, top:0, type:'scroll'},
    tooltip:{trigger:'axis', backgroundColor:SKIN.tipBg, borderColor:SKIN.line, textStyle:{color:SKIN.ink}},
    grid:{left:42,right:48,top:34,bottom:54},
    xAxis:{type:'category', data:dates, axisLabel:{color:SKIN.sub, hideOverlap:true}, axisLine:{lineStyle:{color:SKIN.line}}},
    yAxis:[
      {type:'value', min:0, max:100, splitLine:{lineStyle:{color:SKIN.grid}}, axisLabel:{color:SKIN.sub}, name:'RPS', nameTextStyle:{color:SKIN.sub}},
      {type:'value', splitLine:{show:false}, axisLabel:{color:SKIN.sub, formatter:'{value}%'}, name:'收益%', nameTextStyle:{color:SKIN.sub}}
    ],
    dataZoom:[{type:'inside',start:0,end:100},{type:'slider',height:16,bottom:14,start:0,end:100,borderColor:SKIN.line,textStyle:{color:SKIN.sub}}],
    series:series
  };
  rpsChart.setOption(opt, true);
}

function renderKlineTab(){
  var b=P.boards[state.code];
  var rows = b[state.tf] || b.day;
  if(state.tf==='30m'||state.tf==='60m'){
    rpsChart && rpsChart.clear();
    klChart.clear();
    klChart.setOption({backgroundColor:'transparent',
      title:{text:'分钟级数据待接入', subtext:'本机 vipdoc 仅含板块指数日线（lday），30/60 分钟 K 线需另接分钟数据源', left:'center', top:'middle', textStyle:{color:SKIN.sub, fontSize:18}, subtextStyle:{color:SKIN.sub}},
      xAxis:{show:false,type:'category',data:[]}, yAxis:{show:false,type:'value'}});
    $('#mastrip').innerHTML='<span class="hint">该周期暂无可用的板块指数数据</span>';
    return;
  }
  var dates=rows.map(function(r){return r[0];});
  var ohlc=rows.map(function(r){return [r[1],r[2],r[3],r[4]];});
  var closes=rows.map(function(r){return r[4];});
  var maDefs=[5,10,20,40,60,120,240];
  var maSeries=maDefs.map(function(p,idx){
    return {name:'MA'+p, type:'line', showSymbol:false, smooth:false,
      data:computeMA(p,closes), lineStyle:{width:1.2,color:SKIN.ma[idx]}, itemStyle:{color:SKIN.ma[idx]}};
  });
  var gaps=detectGaps(rows);
  var markPts=gaps.map(function(g){
    return {coord:[g.d, g.price], value: g.type==='up'?'↑跳空':'↓跳空',
      symbol: g.type==='up'?'triangle':'triangle', symbolRotate: g.type==='up'?0:180,
      symbolSize:11, itemStyle:{color: g.type==='up'?SKIN.up:SKIN.down},
      label:{show:true, formatter:g.type==='up'?'上跳空':'下跳空', position:g.type==='up'?'bottom':'top', color:g.type==='up'?SKIN.up:SKIN.down, fontSize:10}};
  });
  var candle={name:'K线', type:'candlestick', data:ohlc,
    itemStyle:{color:SKIN.up, color0:SKIN.down, borderColor:SKIN.up, borderColor0:SKIN.down},
    markPoint:{symbolSize:1, data:markPts}};
  var opt={
    backgroundColor:'transparent',
    legend:{data:maSeries.map(function(s){return s.name;}), textStyle:{color:SKIN.legend}, top:0, type:'scroll'},
    tooltip:{trigger:'axis', backgroundColor:SKIN.tipBg, borderColor:SKIN.line, textStyle:{color:SKIN.ink},
      formatter:function(ps){var s='';ps.forEach(function(p){if(p.seriesName==='K线'){var d=p.data;s+='开'+d[1]+' 高'+d[2]+' 低'+d[3]+' 收'+d[4]+'<br/>';}else{s+=p.marker+p.seriesName+': '+p.data+'<br/>';}});return s;}},
    grid:{left:48,right:18,top:34,bottom:54},
    xAxis:{type:'category', data:dates, axisLabel:{color:SKIN.sub, hideOverlap:true}, axisLine:{lineStyle:{color:SKIN.line}}},
    yAxis:{scale:true, splitLine:{lineStyle:{color:SKIN.grid}}, axisLabel:{color:SKIN.sub}},
    dataZoom:[{type:'inside',start:60,end:100},{type:'slider',height:16,bottom:14,start:60,end:100,borderColor:SKIN.line,textStyle:{color:SKIN.sub}}],
    series:[candle].concat(maSeries)
  };
  klChart.setOption(opt, true);
  // MA strip
  var last=closes.length-1;
  var strip=maDefs.map(function(p,idx){
    var mv=computeMA(p,closes)[last];
    return '<span class="ma"><i style="background:'+SKIN.ma[idx]+'"></i>MA'+p+' <b>'+(mv==null?'-':mv)+'</b></span>';
  }).join('');
  $('#mastrip').innerHTML=strip;
}

function renderControls(){
  // RPS range pills
  var rp=$('#rpsRange'); rp.innerHTML='';
  [20,60,120,250].forEach(function(r){
    var b=el('button','pill'+(state.range===r?' on':''), r+'日');
    b.onclick=function(){state.range=r;renderControls();renderRPSTab();};
    rp.appendChild(b);
  });
  // TF pills
  var tf=$('#tfBar'); tf.innerHTML='';
  [['30m','30分钟'],['60m','60分钟'],['day','日K'],['week','周K'],['month','月K']].forEach(function(t){
    var b=el('button','pill'+(state.tf===t[0]?' on':''), t[1]);
    b.onclick=function(){state.tf=t[0];renderControls();renderKlineTab();};
    tf.appendChild(b);
  });
}

function renderAll(){
  renderList(); renderHeader(); renderControls();
  if(state.tab==='rps'){ $('#rpsView').style.display='block'; $('#klView').style.display='none';
    renderRPSTab(); } else { $('#rpsView').style.display='none'; $('#klView').style.display='block'; renderKlineTab(); }
}
function setTab(t){
  state.tab=t;
  document.querySelectorAll('.tab').forEach(function(e){e.classList.toggle('on', e.dataset.t===t);});
  renderAll();
}

window.onload=function(){
  rpsChart=echarts.init($('#rpsChart'),null,{renderer:'canvas'});
  klChart=echarts.init($('#klChart'),null,{renderer:'canvas'});
  document.querySelectorAll('.tab').forEach(function(e){e.onclick=function(){setTab(e.dataset.t);};});
  renderAll();
  window.addEventListener('resize',function(){rpsChart.resize();klChart.resize();});
};
</script>
</body></html>
